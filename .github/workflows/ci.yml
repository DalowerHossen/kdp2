name: ci

on:
  pull_request:
  push:
    branches: [integration, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tokens:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run verify
      - run: npm run verify-db
      - run: npm run verify-rls
      - run: npm run build
